<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Playground</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #fff;
      overflow: hidden;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 600px 400px at 30% 20%, rgba(99, 102, 241, 0.15), transparent),
        radial-gradient(ellipse 500px 350px at 70% 80%, rgba(16, 185, 129, 0.12), transparent);
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 0.75rem;
      color: #10b981;
      font-weight: 600;
      letter-spacing: 0.03em;
      margin-bottom: 2rem;
    }

    .badge .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 2s infinite;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 50%, #10b981 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.5);
      max-width: 480px;
      margin: 0 auto 2.5rem;
      line-height: 1.6;
    }

    .status-card {
      display: inline-flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 1.5rem 2rem;
      backdrop-filter: blur(12px);
      text-align: left;
      min-width: 280px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .status-row .label { color: rgba(255,255,255,0.4); }
    .status-row .value { color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }
    .status-row .value.green { color: #10b981; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">
    <div class="badge">
      <span class="dot"></span>
      DEPLOY ATIVO
    </div>
    <h1>Demo Playground</h1>
    <p>Aplicação de demonstração deployada via WebTech Playground.</p>
    <div class="status-card">
      <div class="status-row">
        <span class="label">Status</span>
        <span class="value green" id="status">Carregando...</span>
      </div>
      <div class="status-row">
        <span class="label">Node.js</span>
        <span class="value" id="node">—</span>
      </div>
      <div class="status-row">
        <span class="label">Uptime</span>
        <span class="value" id="uptime">—</span>
      </div>
    </div>
  </div>

  <script>
    async function fetchHealth() {
      try {
        const res = await fetch("/api/health");
        const data = await res.json();
        document.getElementById("status").textContent = "Online ✓";
        document.getElementById("node").textContent = data.node;
        const secs = Math.floor(data.uptime);
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        document.getElementById("uptime").textContent =
          m > 0 ? `${m}m ${s}s` : `${s}s`;
      } catch {
        document.getElementById("status").textContent = "Offline";
        document.getElementById("status").style.color = "#ef4444";
      }
    }
    fetchHealth();
    setInterval(fetchHealth, 5000);
  </script>
</body>
</html>
